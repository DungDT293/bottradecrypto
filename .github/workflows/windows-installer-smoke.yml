name: Windows installer smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'config.example.yaml'
      - '.github/workflows/windows-installer-smoke.yml'

jobs:
  package-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build frontend
        working-directory: desktop
        run: npm run build

      - name: Install Tauri CLI
        working-directory: desktop
        run: cargo install tauri-cli --version 2.8.4 --locked

      - name: Build Windows installer
        working-directory: desktop
        run: cargo tauri build --bundles nsis

      - name: Run installer smoke test
        shell: pwsh
        run: ./scripts/windows_installer_smoke.ps1
