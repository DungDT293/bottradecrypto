name: Windows installer smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'config.example.yaml'
      - '.github/workflows/windows-installer-smoke.yml'

jobs:
  package-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build frontend
        working-directory: desktop
        run: npm run build

      - name: Install Tauri CLI
        working-directory: desktop
        run: cargo install tauri-cli --version 2.8.4 --locked

      - name: Build backend sidecar
        shell: pwsh
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --clean --noconfirm backend-x86_64-pc-windows-msvc.spec
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries | Out-Null
          Copy-Item dist/backend-x86_64-pc-windows-msvc.exe desktop/src-tauri/binaries/backend-x86_64-pc-windows-msvc.exe -Force

      - name: Prepare sanitized packaged config
        shell: pwsh
        run: |
          Copy-Item config.example.yaml desktop/src-tauri/config.yaml -Force
          $path = 'desktop/src-tauri/tauri.conf.json'
          $cfg = Get-Content -Raw $path | ConvertFrom-Json
          $cfg.bundle.resources = @('config.yaml')
          $cfg | ConvertTo-Json -Depth 20 | Set-Content -Encoding utf8 $path

      - name: Build Windows installer
        working-directory: desktop
        run: cargo tauri build --bundles nsis

      - name: Run installer smoke test
        shell: pwsh
        run: ./scripts/windows_installer_smoke.ps1
